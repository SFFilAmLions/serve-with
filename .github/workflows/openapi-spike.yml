name: OpenAPI generator spike
on:
  pull_request:
    paths:
      - 'openapi/**'
      - '.github/workflows/openapi-spike.yml'
      - 'scripts/validate-openapi.mjs'
      - 'scripts/openapi-runtime-spike.mjs'
      - 'scripts/generate-server-contract.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client-types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Validate YAML structure
        run: node scripts/validate-openapi.mjs
      - name: Generate TypeScript operation types from authoritative YAML
        run: npx --yes --package=openapi-typescript@7.13.0 openapi-typescript openapi/openapi.yaml -o /tmp/api-types.d.ts
      - name: Verify generated operations exist
        run: |
          test -s /tmp/api-types.d.ts
          grep -F '"/api/events/{id}"' /tmp/api-types.d.ts
          grep -F '"/api/admin/events"' /tmp/api-types.d.ts
          grep -F 'createAdminEvent' /tmp/api-types.d.ts
      - name: Generate typed Worker operation interfaces from YAML
        run: node scripts/generate-server-contract.mjs openapi/openapi.yaml /tmp/api-server-contract.ts
      - name: Type-check generated Worker interfaces against generated OpenAPI operations
        run: npx tsc --noEmit --skipLibCheck --target es2022 --module esnext --moduleResolution bundler --lib es2022,dom /tmp/api-server-contract.ts
      - name: Install pinned runtime spike dependencies (not production)
        run: npm install --no-save --package-lock=false openapi-fetch@0.15.0 ajv@8.17.1
      - name: Exercise callable OpenAPI client and JSON Schema validation
        run: node scripts/openapi-runtime-spike.mjs
