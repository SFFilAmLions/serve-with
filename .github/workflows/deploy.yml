name: Deploy staging
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: serve-with-staging
  cancel-in-progress: true
jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Build with commit identifier
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}
        run: npm run build
      - name: Deploy staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing Cloudflare secrets"; exit 1; }
          # Record and apply unapplied versioned schema changes before deploying new code.
          # 0001_auth.sql uses IF NOT EXISTS and can safely baseline the existing staging schema.
          npx wrangler d1 migrations apply serve-with-staging-db --env staging --remote
          npx wrangler deploy --env staging
