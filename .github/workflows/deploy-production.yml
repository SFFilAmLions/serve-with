name: Deploy production
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Published, stable GitHub release tag to promote (e.g. v0.2.0)"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: serve-with-production
  cancel-in-progress: false
jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify published stable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Expected stable semver release tag"; exit 1; }
          release="$(gh api "repos/$GH_REPO/releases/tags/$TAG")" || { echo "::error::Release tag not found"; exit 1; }
          echo "$release" | jq -e '.draft == false and .prerelease == false and .published_at != null' >/dev/null || { echo "::error::Release is not published and stable"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Build with released commit identifier
        env:
          VITE_DEPLOY_ENV: production
          VITE_RELEASE_TAG: ${{ inputs.release_tag }}
        run: npm run build
      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing Cloudflare secrets"; exit 1; }
          # Require explicit production D1 configuration in the approved release.
          # Staging and production use independent databases and migration histories.
          if ! grep -q '"production"' wrangler.jsonc; then
            echo "::error::Production D1 binding is not configured in this release. Refusing deployment."
            exit 1
          fi
          npx wrangler d1 migrations apply serve-with-prod-db --env production --remote
          npx wrangler deploy --env production
