  /api/admin/events:
    post:
      tags: [Administration]
      operationId: createAdminEvent
      summary: Create an event (administrator only)
      description: |
        Requires an authenticated, fully eligible administrator. The Worker
        also requires a same-origin Origin header and rejects cross-site
        Sec-Fetch-Site. Authorization, age/policy checks and CSRF defense
        remain server-side and are not implied by the generated client.
      security:
        - SessionCookie: []
      parameters:
        - in: header
          name: Origin
          required: true
          schema:
            type: string
            format: uri
          description: Must equal the request origin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreateInput'
            example:
              title: Neighborhood Cleanup
              location: Community Park
              timezone: America/Los_Angeles
              start: '2026-11-14T09:00'
              end: '2026-11-14T12:00'
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
        '400':
          description: Invalid request or origin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not an eligible administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid event fields
          content:
            application/json:
              schema:
                type: object
                required: [error, fields]
                properties:
                  error:
                    type: string
                  fields:
                    type: object
                    additionalProperties:
                      type: string
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

