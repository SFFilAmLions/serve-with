openapi: 3.1.0
info:
  title: Serve With API
  version: 0.1.0
  description: |
    Contract-first API reference. Initial draft for the SDDW-006 generator
    spike; not complete and not yet published. Existing routes are being
    inventoried before the final contract is accepted.
servers:
  - url: /
    description: Same-origin deployment
tags:
  - name: Events
  - name: Authentication
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-sw_session
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
    Event:
      type: object
      required: [id, title, location, timezone, start_at, end_at, version]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        location:
          type: string
        timezone:
          type: string
        start_at:
          type: integer
          format: int64
          description: Unix epoch milliseconds
        end_at:
          type: integer
          format: int64
          description: Unix epoch milliseconds
        version:
          type: integer
    EventDetail:
      type: object
      required: [event]
      properties:
        event:
          $ref: '#/components/schemas/Event'
paths:
  /api/events:
    get:
      tags: [Events]
      operationId: listEvents
      summary: List public events
      security: []
      parameters:
        - in: query
          name: view
          schema:
            type: string
            enum: [upcoming, past]
            default: upcoming
      responses:
        '200':
          description: Event list
          content:
            application/json:
              schema:
                type: object
                required: [view, events]
                properties:
                  view:
                    type: string
                    enum: [upcoming, past]
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
        '400':
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/events/{id}:
    get:
      tags: [Events]
      operationId: getEvent
      summary: Read public event details
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Event detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
