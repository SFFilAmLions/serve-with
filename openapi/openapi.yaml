  /api/me/signups:
    get:
      operationId: listMySignups
      tags: [Events]
      summary: Current and withdrawn signup history for the authenticated attendee
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Own signup records including withdrawals
          content:
            application/json:
              schema:
                type: object
                required: [signups]
                properties:
                  signups:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Profile or consent incomplete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/events/{id}/signups:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getMyEventSignup
      tags: [Events]
      summary: Get the current attendee's active signup, if any
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Own active signup or null
          content:
            application/json:
              schema:
                type: object
                required: [signup]
                properties:
                  signup: {type: [object, 'null']}
        '401':
          description: Not signed in
    post:
      operationId: signUpForEvent
      tags: [Events]
      summary: Sign up the authenticated eligible attendee
      security:
        - SessionCookie: []
      parameters:
        - in: header
          name: Origin
          required: true
          schema: {type: string, format: uri}
      responses:
        '201':
          description: Created signup
          content:
            application/json:
              schema:
                type: object
                required: [signup]
                properties:
                  signup: {type: object}
        '401':
          description: Not signed in
        '403':
          description: Profile or consent incomplete
        '409':
          description: Closed, full or duplicate
    delete:
      operationId: withdrawFromEvent
      tags: [Events]
      summary: Soft-delete attendee's own active signup before event start
      security:
        - SessionCookie: []
      parameters:
        - in: header
          name: Origin
          required: true
          schema: {type: string, format: uri}
      responses:
        '200':
          description: Whether an active signup was withdrawn
          content:
            application/json:
              schema:
                type: object
                required: [withdrawn]
                properties:
                  withdrawn: {type: boolean}
        '401':
          description: Not signed in
        '403':
          description: Profile or consent incomplete
        '409':
          description: Event already started

  /api/events/{id}/participants:
    get:
      operationId: getEventParticipants
      tags: [Events]
      summary: Current attendee names, visible only to an active participant
      security:
        - SessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Active participant names only; no email, DOB or history
          content:
            application/json:
              schema:
                type: object
                required: [participants]
                properties:
                  participants:
                    type: array
                    items:
                      type: object
                      required: [name]
                      properties:
                        name: {type: string}
        '401':
          description: Sign-in required
        '403':
          description: Active participation required
        '404':
          description: Event missing or deleted

  /api/admin/events/{id}/signups:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: listAdminEventSignups
      tags: [Administration]
      summary: Roster and history for an event, administrator only
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Authorized administrative signup history
          content:
            application/json:
              schema:
                type: object
                required: [signups]
                properties:
                  signups:
                    type: array
                    items: {type: object, additionalProperties: true}
        '401': {description: Sign-in required}
        '403': {description: Administrator permission required}
    post:
      operationId: adminSignUpAttendee
      tags: [Administration]
      summary: Register a chosen attendee subject to capacity and event-start cutoff
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: {type: string, format: uuid}
      responses:
        '201':
          description: Signup created
          content:
            application/json:
              schema:
                type: object
                required: [signup]
                properties:
                  signup: {type: object}
        '401': {description: Sign-in required}
        '403': {description: Administrator permission required}
        '409': {description: Duplicate, full or cutoff}
    delete:
      operationId: adminWithdrawAttendee
      tags: [Administration]
      summary: Withdraw selected attendee before event start
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: {type: string, format: uuid}
      responses:
        '200':
          description: Withdrawal result
          content:
            application/json:
              schema:
                type: object
                required: [withdrawn]
                properties:
                  withdrawn: {type: boolean}
        '401': {description: Sign-in required}
        '403': {description: Administrator permission required}
        '409': {description: Event already started}

  /api/admin/usage:
    get:
      operationId: getAdminUsage
      tags: [Administration]
      summary: Provider usage and availability for authorized administrators
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Metrics when verified, otherwise explicitly unavailable
          content:
            application/json:
              schema:
                type: object
                required: [environment, collectedAt, providers]
                properties:
                  environment: {type: string}
                  collectedAt: {type: string, format: date-time}
                  providers:
                    type: array
                    items:
                      type: object
                      required: [name, scope, status, used, limit, remaining]
                      properties:
                        name: {type: string}
                        scope: {type: string}
                        status: {type: string, enum: [available, stale, unavailable]}
                        used: {type: [number, 'null']}
                        limit: {type: [number, 'null']}
                        remaining: {type: [number, 'null']}
                        resetsAt: {type: [string, 'null']}
                        reason: {type: string}
        '401': {description: Not signed in}
        '403': {description: Administrator rights required}
